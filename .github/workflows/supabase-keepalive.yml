name: Supabase keepalive

on:
  schedule:
    # Daily at 09:00 UTC — keeps the free-tier project from pausing between bakes.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          # Project URL — same value as in .env.local (VITE_ prefix matches the app).
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          # Server-only key — never use VITE_ prefix; do not add to .env.local.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing VITE_SUPABASE_URL."
            echo "Add it under Settings → Secrets and variables → Actions → Secrets (or Variables)."
            exit 1
          fi

          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Missing SUPABASE_SECRET_KEY (or legacy SUPABASE_SERVICE_ROLE_KEY)."
            echo "Add the secret key from Supabase → Project Settings → API → Secret keys."
            echo "GitHub: Settings → Secrets and variables → Actions → New repository secret."
            echo "Do not add this key to .env.local or any VITE_ variable."
            exit 1
          fi

          # Use apikey header only — new sb_secret_ keys are not JWTs and must not go on Authorization.
          curl -fsS -X GET \
            "${SUPABASE_URL%/}/rest/v1/saved_recipes?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SECRET_KEY}"

          echo "Supabase keepalive ping succeeded."
